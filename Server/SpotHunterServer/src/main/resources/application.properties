
spring.application.name=SpotHunterServer

# ===================== MySQL  =====================
spring.datasource.url=jdbc:mysql://localhost:3306/spot_hunter?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# spring.datasource.username=kongshan

# spring.datasource.password=zmt20041204

spring.datasource.username=root

spring.datasource.password=root1234

# ===================== JPA / Hibernate  =====================

spring.jpa.hibernate.ddl-auto=update

# Hibernate  SQL
spring.jpa.show-sql=true

#  SQL
spring.jpa.properties.hibernate.format_sql=true

# Asia/Shanghai
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

logging.level.org.hibernate.SQL=DEBUG

# ===================== JWT 配置 =====================
jwt.secret=SpotHunterSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# ===================== 文件上传配置 =====================
file.upload.dir=./uploads
file.upload.url-prefix=/upload